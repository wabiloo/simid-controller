name: Deploy demo app to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to deploy
        required: true
        default: develop
      label:
        description: 'Deployment label — becomes the URL path (e.g. "v0.7.0", "demo-dai")'
        required: true
        default: develop

permissions:
  contents: write

# Concurrent deployments to the same label cancel each other; different labels run in parallel
concurrency:
  group: pages-${{ inputs.label }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/controller/package-lock.json

      # Build the controller library first (app depends on it via file:../controller)
      - name: Install controller dependencies
        run: npm ci
        working-directory: web/controller

      - name: Build controller
        run: npm run build
        working-directory: web/controller

      # Build the demo app
      - name: Install app dependencies
        run: npm ci
        working-directory: web/app

      - name: Build app
        run: npm run build -- --output-public-path "/simid-controller/${{ inputs.label }}/dist/"
        working-directory: web/app

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web/app/public
          target-folder: ${{ inputs.label }}
          # clean: true (default) — wipes only the target subfolder, preserving other deployments

      - name: Show deployment URL
        run: |
          URL="https://wabiloo.github.io/simid-controller/${{ inputs.label }}/"
          echo "## Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**$URL**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built from \`${{ inputs.ref }}\` with label \`${{ inputs.label }}\`" >> $GITHUB_STEP_SUMMARY
