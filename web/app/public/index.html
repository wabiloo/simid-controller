<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <title>New Formats - Pre-roll on channel change</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bitmovin-player-ui@4/dist/css/bitmovinplayer-ui.css">
  <script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bitmovin-player-ui@4/dist/js/bitmovinplayer-ui.js"></script>
  <script src="./dist/main.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b10; color: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: #080b10; }
    button { font: inherit; }
    .app-shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); grid-template-rows: auto 1fr; column-gap: 22px; row-gap: 18px; min-height: 100vh; max-width: 1600px; margin: auto; padding: 28px; }
    .brand-logo { grid-column: 1; grid-row: 1; position: relative; top: -28px; display: block; width: 188px; height: auto; margin: 0; justify-self: center; align-self: start; }
    .layout { display: contents; }
    .left-rail { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .campaign-tile { padding: 2px 8px 0; }
    .campaign-title { margin: 0; color: #00a5d9; font-size: 15px; line-height: 1.25; font-weight: 750; letter-spacing: -.015em; }
    .campaign-subtitle { margin: 4px 0 0; color: #a3afbd; font-size: 11px; line-height: 1.4; }
    .guide { display: flex; flex-direction: column; min-height: 0; overflow: hidden; border: 1px solid #ffffff14; border-radius: 12px; background: #10151d; }
    #channels { display: flex; flex-direction: column; gap: 4px; max-height: min(680px, calc(100vh - 130px)); overflow: auto; padding: 8px; scrollbar-color: #344354 transparent; scrollbar-width: thin; }
    .channel-card { display: grid; grid-template-columns: 60px minmax(0, 1fr); align-items: center; gap: 12px; width: 100%; min-height: 70px; padding: 7px; border: 1px solid transparent; border-radius: 8px; text-align: left; color: inherit; background: transparent; cursor: pointer; transition: background .15s, border-color .15s; }
    .channel-card:hover { background: #ffffff0b; }
    .channel-card:focus-visible, .icon-button:focus-visible, .zap-button:focus-visible { outline: 2px solid #77ccff; outline-offset: 2px; }
    .channel-card.is-active { border-color: #53baf477; background: #153047; box-shadow: inset 3px 0 #57c0ff; }
    .channel-thumbnail { display: block; width: 56px; height: 56px; border-radius: 7px; object-fit: contain; background: transparent; }
    .channel-thumbnail.thumbnail-fallback { background: transparent; }
    .channel-details { display: grid; min-width: 0; grid-template-columns: 25px minmax(0, 1fr); align-items: baseline; column-gap: 5px; row-gap: 3px; }
    .channel-number { color: #67c2f5; font-size: 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .channel-name { overflow: hidden; color: #ebf0f6; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .channel-category { grid-column: 2; overflow: hidden; color: #78889a; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .key-legend { display: flex; flex-direction: column; gap: 9px; padding: 14px 16px 16px; border-top: 1px solid #ffffff12; color: #a3afbd; font-size: 11px; }
    .key-hint { display: flex; align-items: center; gap: 8px; }
    .key-hint > span:last-child { margin-left: auto; color: #748396; }
    .key-pair { display: inline-flex; gap: 3px; }
    kbd { display: inline-grid; place-items: center; min-width: 23px; height: 22px; padding: 0 5px; border: 1px solid #ffffff22; border-radius: 5px; background: #ffffff08; color: #e0e8f0; font: inherit; font-size: 11px; }
    .screen-column { grid-column: 2; grid-row: 1 / span 2; min-width: 0; align-self: start; }
    #player-container { position: relative; isolation: auto; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; background: #000; box-shadow: 0 18px 55px #0008, 0 0 0 1px #ffffff16; }
    #player { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* Keep SIMID iframes in normal flow: Chrome paints absolutely positioned
       cross-origin iframe surfaces opaquely over the video, even when their
       document and iframe backgrounds are transparent. #player is positioned
       already, so this places the creative at the player origin without the
       opaque-overlay compositing path. */
    #player-container iframe.simid-creative { width: 100%; height: 100%; z-index: 20; border: 0; background-color: transparent !important; }
    .ad-mode-status { display: flex; justify-content: center; margin: 0; padding: 12px 16px 16px; border-top: 1px solid #ffffff12; color: #a3afbd; font-size: 11px; font-weight: 700; letter-spacing: .02em; }
    .ad-mode-status[data-mode="on-zap"] { color: #9cddff; }
    .temporary-playback-controls { padding: 10px 8px 12px; border-top: 1px solid #ffffff12; }
    #temporary-pause-button { width: 100%; min-height: 40px; padding: 8px 14px; border: 1px solid #ffffff20; border-radius: 7px; background: #182430; color: #c5d0dc; font-size: 13px; font-weight: 650; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
    #temporary-pause-button:hover { background: #203749; border-color: #00a5d966; color: #fff; }
    #temporary-pause-button:focus-visible { outline: 2px solid #00a5d9; outline-offset: 2px; }
    .screen-toolbar { position: absolute; top: 12px; right: 12px; z-index: 30; opacity: .25; transition: opacity .2s; }
    #player-container:hover .screen-toolbar, .screen-toolbar:focus-within { opacity: 1; }
    .icon-button, .zap-button { border: 1px solid #ffffff30; color: #fff; background: #070b10bb; backdrop-filter: blur(12px); cursor: pointer; }
    .icon-button { min-height: 38px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 700; }
    .icon-button::before { content: '⛶'; margin-right: 7px; font-size: 16px; vertical-align: -1px; }
    .icon-button:hover, .zap-button:hover { background: #1a2d42ee; border-color: #70c9ff99; }
    .channel-toast { position: absolute; z-index: 40; top: 16px; left: 16px; padding: 9px 12px; border: 1px solid #ffffff22; border-radius: 7px; background: #070b10c9; color: white; font-size: 13px; font-weight: 750; opacity: 0; transform: translateY(-5px); pointer-events: none; transition: opacity .2s, transform .2s; text-shadow: 0 1px 2px #000; }
    .channel-toast.is-visible { opacity: 1; transform: translateY(0); }
    .status-message { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: #622634; color: #ffe3e7; font-size: 13px; }
    .theater-mode { overflow: hidden; }
    .theater-mode .app-shell { display: block; max-width: none; height: 100vh; padding: 0; }
    .theater-mode .brand-logo { display: none; }
    .theater-mode .layout { display: block; height: 100%; }
    .theater-mode .left-rail, .theater-mode .status-message { display: none; }
    .theater-mode .screen-column { height: 100%; }
    .theater-mode .temporary-playback-controls { display: none; }
    .theater-mode #player-container { position: fixed; z-index: 100; inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
    .theater-mode #player { inset: 0; }
    .theater-mode .screen-toolbar { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); opacity: 0; }
    .theater-mode #player-container:hover .screen-toolbar, .theater-mode .screen-toolbar:focus-within { opacity: 1; }
    .theater-mode .icon-button { min-width: 40px; min-height: 40px; font-size: 13px; }
    .theater-mode .zap-controls { position: fixed; z-index: 130; top: 50%; right: 18px; display: flex; flex-direction: column; gap: 10px; transform: translateY(-50%); opacity: .2; transition: opacity .2s; }
    .theater-mode .zap-controls:hover, .theater-mode .zap-controls:focus-within { opacity: 1; }
    .zap-controls { display: none; }
    .zap-button { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; font-size: 20px; }
    .channel-card, .icon-button, .zap-button { -webkit-tap-highlight-color: transparent; }
    .theater-mode .channel-toast { top: max(24px, env(safe-area-inset-top)); left: max(24px, env(safe-area-inset-left)); font-size: 15px; }
    @media (max-width: 760px) {
      .app-shell { grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); column-gap: 10px; row-gap: 12px; padding: 12px; }
      .brand-logo { top: -12px; width: min(150px, 100%); }
      .layout { grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 10px; }
      .screen-column { grid-column: 2; grid-row: 1 / span 2; }
      #channels { max-height: calc(100vh - 130px); padding: 5px; }
      .channel-card { grid-template-columns: 40px minmax(0, 1fr); gap: 6px; padding: 5px; }
      .channel-thumbnail { width: 40px; height: 40px; }
      .channel-details { grid-template-columns: 20px minmax(0, 1fr); }
      .channel-category { display: none; }
      .key-legend { padding: 10px; }
      .key-hint { flex-wrap: wrap; }
      .key-hint > span:last-child { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <img class="brand-logo" src="./broadpeak-logo.png" alt="Broadpeak">
    <section class="layout" aria-label="Channel guide and video player">
      <div class="left-rail">
        <section class="campaign-tile" aria-label="New ad format">
          <h1 class="campaign-title">New Ad Formats</h1>
          <p class="campaign-subtitle">Squeeze-back on channel change</p>
        </section>
        <aside class="guide" aria-label="Channels">
          <div id="channels" role="list"></div>
          <div class="key-legend" aria-label="Keyboard shortcuts">
            <div class="key-hint"><span class="key-pair"><kbd>↑</kbd><kbd>↓</kbd></span><span>Change channel</span></div>
            <div class="key-hint"><kbd>F</kbd><span>Toggle theater view</span></div>
            <div class="key-hint"><kbd>Esc</kbd><span>Exit theater view</span></div>
          </div>
          <div id="ad-mode-pill" class="ad-mode-status" role="status" aria-live="polite">Ad mode · Pre-roll</div>
        </aside>
        <div class="temporary-playback-controls">
          <button id="temporary-pause-button" type="button" aria-pressed="false">Pause playback</button>
        </div>
      </div>
      <div class="screen-column">
        <div id="player-container" aria-label="Video player">
          <div id="player"></div>
          <div id="channel-toast" class="channel-toast" role="status" aria-live="polite"></div>
          <div class="screen-toolbar">
            <button id="theater-toggle" class="icon-button" type="button" aria-pressed="false" title="Theater mode (F)">Theater mode</button>
          </div>
          <div id="zap-controls" class="zap-controls" aria-label="Channel controls" aria-hidden="true">
            <button id="channel-up" class="zap-button" type="button" aria-label="Previous channel" title="Previous channel">⌃</button>
            <button id="channel-down" class="zap-button" type="button" aria-label="Next channel" title="Next channel">⌄</button>
          </div>
        </div>
        <div id="status-message" class="status-message" role="alert" hidden></div>
      </div>
    </section>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => setTimeout(() => initApp(), 300));
    window.addEventListener('beforeunload', () => stopApp());
  </script>
</body>
</html>
