
<html>
<head>
  <title>Broadpeak SIMID Demo (Tizen)</title>

  <!--
    Bitmovin modular player build (recommended for Smart TVs to keep footprint small).
    See: https://developer.bitmovin.com/playback/docs/getting-started-with-the-web-player-on-samsung-tizen
    Adjust the module list to match your stream requirements (DRM, subtitles, etc.)
    NOTE: no DRM module is included since this demo does not use DRM-protected content.
  -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-core.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-polyfill.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-engine-bitmovin.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-container-mp4.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-container-ts.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-mserenderer.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-abr.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-xml.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-dash.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-hls.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-crypto.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bitmovin-player@8/modules/bitmovinplayer-tizen.js"></script>

  <!-- app -->
  <script src="./dist/main.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: black;
      overflow: hidden;
    }

    main {
      width: 100%;
      height: 100%;
      display: flex;
      background: #000;
    }

    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #player {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      border: 0;
    }
  </style>
</head>
<body>

<main>
  <div id="player-container">
    <div id="player"></div>
    <!-- SIMID creative iframe gets appended here -->
  </div>
</main>

</body>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { initApp(); }, 500);
  });

  window.addEventListener('beforeunload', function () {
    stopApp();
  });
</script>
</html>
